{% extends "base.html" %}
{% block content %}
<form class="panel narrow auth-panel" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="panel-header"><p class="eyebrow">Account access</p><h2>Forgot password</h2></div>
  <p class="muted">Enter your campus email to request a reset link.</p>
  <label class="email-field-label">Campus email<input type="email" name="email" required></label>
  <button class="btn full-width">Send reset link</button>
  <p class="muted"><a href="{{ url_for('login') }}">Back to log in</a></p>
</form>
{% endblock %}
