{% extends "base.html" %}
{% block content %}
<form class="panel narrow auth-panel" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="panel-header"><p class="eyebrow">Account access</p><h2>Set a new password</h2></div>
  <label>New password<input type="password" name="password" minlength="6" required></label>
  <label>Confirm password<input type="password" name="confirm_password" minlength="6" required></label>
  <button class="btn full-width">Reset password</button>
</form>
{% endblock %}
